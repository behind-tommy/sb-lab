[project]
name = "sb-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
# This is a deployable app, not a distributable library — don't try to
# build/install "sb-lab" itself as a package, just install its dependencies.
package = false

[dependency-groups]
dev = [
    "locust>=2.46.4",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
# The app isn't installed as a package (see [tool.uv] above), so pytest
# can't find `app.main` unless we tell it to look in the project root.
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style requires calling Depends(...) as an
# argument default (`session: AsyncSession = Depends(get_session)`) — that's
# the documented, correct pattern, not the mistake rule B008 usually catches.
extend-immutable-calls = ["fastapi.Depends"]
